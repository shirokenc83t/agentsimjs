name: Update visual baselines

# Manual only (ADR-0032 §9): regenerates the visual-regression baselines on the pinned Playwright image, never on
# a dev machine, and commits them to a review branch. Runs on phase/* branches only, and only when the repository
# owner starts it (a collaborator or a fork cannot). The reason is required and goes into the commit message. Third-party actions are pinned to commit SHAs (checked by
# tools/test/visual-image.test.ts).
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why the baselines change (recorded in the commit message)"
        required: true
        type: string

permissions: {}

# Two runs on the same branch queue instead of racing.
concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    # Maintainers only: workflow_dispatch already needs write access, and this refuses everyone but the owner.
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The only write permissions in the repository's workflows, explicit at job level (the top level is empty).
    permissions:
      contents: write
      pull-requests: write
    container:
      # Pinned by digest; the comment names its tag, which must match @playwright/test (tools/test/visual-image.test.ts).
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --user 1001
    steps:
      - name: Refuse anything but a phase branch
        run: |
          case "$GITHUB_REF" in
            refs/heads/phase/*) echo "Branch: $GITHUB_REF_NAME" ;;
            *) echo "::error::Baselines are regenerated on phase/* branches only (got $GITHUB_REF)."; exit 1 ;;
          esac

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Regenerate baselines
        run: pnpm test:visual:update
        env:
          AGENTSIM_VISUAL_IMAGE: "1"

      - name: Attach baselines for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # The review branch below carries the same images: a full artifact storage must not stop the commit, and the artifact is short-lived.
        continue-on-error: true
        with:
          name: visual-baselines-${{ github.run_id }}
          path: apps/lab/e2e/visual/__screenshots__/
          retention-days: 3

      # Only baseline images may change; anything else means the run touched the tree and nothing is committed.
      # The reason reaches the script through the environment, never interpolated into it (no injection).
      - name: Commit to a review branch
        env:
          REASON: ${{ inputs.reason }}
        run: |
          dir="apps/lab/e2e/visual/__screenshots__/"
          other="$(git status --porcelain --untracked-files=all | awk '{ print $NF }' | grep -v "^${dir}" || true)"
          if [ -n "$other" ]; then
            echo "::error::Files outside ${dir} changed; refusing to commit:"
            echo "$other"
            exit 1
          fi
          if [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Baselines unchanged; nothing to commit." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="visual-baselines/${GITHUB_REF_NAME}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- "$dir"
          git commit -m "test(visual): update baselines" -m "$REASON" \
            -m "Generated by run ${GITHUB_RUN_ID} on mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 (v1.63.0-noble) from ${GITHUB_SHA} (${GITHUB_REF_NAME})."
          git push origin "$branch"
          echo "Review branch: $branch" | tee -a "$GITHUB_STEP_SUMMARY"
